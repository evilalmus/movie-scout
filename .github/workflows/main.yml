name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure public API address
        env:
          MOVIE_SCOUT_API_BASE: ${{ vars.MOVIE_SCOUT_API_BASE }}
          MOVIE_SCOUT_CUSTOM_DOMAIN: ${{ vars.MOVIE_SCOUT_CUSTOM_DOMAIN }}
        run: node scripts/configure-pages.mjs
      - run: npm run build:frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
